<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MUNSEL HARMONY TONAL BOOK</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101216;
      color: #f2f3f5;
    }

    * { box-sizing: border-box; }
    body { margin: 0; }

    main {
      width: min(1900px, calc(100% - 32px));
      margin: 36px auto;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(400px, 500px) minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .sidebar,
    .grid-panel {
      border: 1px solid #343943;
      border-radius: 12px;
      background: #191c22;
      overflow: hidden;
    }

    .sidebar-content { padding: 22px; }

    h1 {
      margin: 0;
      font-size: clamp(26px, 5vw, 44px);
      letter-spacing: 0.08em;
    }

    .palettes {
      display: grid;
      gap: 14px;
      margin-top: 18px;
    }

    .palette-panel {
      padding: 13px;
      border: 1px solid #343943;
      border-radius: 9px;
      background: #15181e;
    }

    .palette-panel h2 { margin: 0 0 10px; font-size: 15px; }

    .palette-result { display: grid; }

    .palette-groups { min-height: 1010px; }

    .palette-group + .palette-group { margin-top: 10px; }

    .palette-group-title {
      margin: 0 0 5px;
      color: #858c98;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .palette-colors {
      display: grid;
      grid-template-columns: repeat(7, 55px);
      grid-auto-rows: 69px;
      gap: 5px;
    }

    .palette-color {
      display: grid;
      grid-template-rows: 38px auto;
      width: 55px;
      height: 69px;
      min-width: 0;
      overflow: hidden;
      border: 1px solid #3d434e;
      border-radius: 5px;
      background: #20242b;
    }

    .palette-chip { border-bottom: 1px solid #3d434e; }

    .palette-color-name {
      height: 30px;
      padding: 4px 3px;
      overflow: hidden;
      overflow-wrap: anywhere;
      color: #c5cad2;
      font: 8px/1.25 ui-monospace, SFMono-Regular, Menlo, monospace;
      text-align: center;
    }

    .palette-color.reserved { visibility: hidden; }

    .palette-color.malformed .palette-chip {
      background-color: #171a20;
      background-image:
        linear-gradient(45deg, #242832 25%, transparent 25%),
        linear-gradient(-45deg, #242832 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #242832 75%),
        linear-gradient(-45deg, transparent 75%, #242832 75%);
      background-position: 0 0, 0 6px, 6px -6px, -6px 0;
      background-size: 12px 12px;
    }

    .palette-error-area {
      height: 120px;
      margin-top: 10px;
      overflow: auto;
      border-top: 1px solid #343943;
    }

    .palette-errors {
      margin: 9px 0 0;
      padding-left: 17px;
      color: #e7adad;
      font-size: 11px;
      line-height: 1.4;
    }

    .controls {
      display: grid;
      gap: 16px;
      margin-top: 22px;
    }

    .control-group { display: grid; gap: 7px; }

    .control-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .select-label {
      display: grid;
      gap: 5px;
      color: #b9bec8;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    select,
    button {
      min-height: 40px;
      border: 1px solid #555c68;
      border-radius: 7px;
      background: #252932;
      color: #f2f3f5;
      font: inherit;
    }

    select { width: 100%; min-width: 0; padding: 8px 36px 8px 11px; }
    button { padding: 7px 13px; cursor: pointer; }
    button:hover { background: #303641; }

    .page-heading {
      display: grid;
      gap: 10px;
      padding: 15px 18px;
      border-top: 1px solid #343943;
    }

    .page-heading h2 { margin: 0; font-size: 20px; }
    .page-note { color: #969da9; font-size: 13px; }

    .book-scroll {
      max-height: calc(100vh - 72px);
      overflow: auto;
      padding: 18px;
    }

    .book-grid {
      display: grid;
      grid-template-columns: 80px repeat(var(--value-count), 38px);
      gap: 5px;
      width: max-content;
      align-items: stretch;
    }

    .corner,
    .value-heading,
    .chroma-label {
      position: sticky;
      z-index: 2;
      display: grid;
      place-items: center;
      min-height: 34px;
      color: #aeb4bf;
      background: #191c22;
      font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .corner,
    .value-heading { top: 0; }
    .corner,
    .chroma-label { left: 0; }
    .corner { z-index: 3; text-align: center; line-height: 1.25; white-space: pre-line; }
    .chroma-label { grid-auto-flow: column; gap: 5px; padding: 0 5px; justify-content: space-between; }
    .chroma-label.primary { color: #e4c38a; }
    .chroma-label.neutral { color: #f2f3f5; border-block: 1px solid #555c68; }
    .chroma-label.related { color: #94c7df; }

    .swatch,
    .empty {
      width: 38px;
      height: 38px;
      border-radius: 5px;
    }

    .empty {
      border: 1px dashed #2d313a;
      background: #16191e;
    }

    .neutral-cell { box-shadow: 0 1px 0 #555c68, 0 -1px 0 #555c68; }

    .swatch {
      display: flex;
      position: relative;
      z-index: 1;
      justify-content: center;
      align-items: center;
      padding: 3px;
      border: 1px solid rgb(255 255 255 / 0.18);
      color: var(--label-color);
      box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.08);
      font: 650 7px/1.05 ui-monospace, SFMono-Regular, Menlo, monospace;
      text-align: center;
      text-shadow: var(--label-shadow);
    }

    .status { margin: 20px; color: #b9bec8; }

    @media (max-width: 760px) {
      main { width: min(100% - 20px, 1900px); margin: 22px auto; }
      .workspace { grid-template-columns: 1fr; }
      .book-scroll { max-height: 70vh; padding: 10px; }
    }
  </style>
</head>
<body>
  <main class="workspace">
    <section class="sidebar" aria-live="polite">
      <div class="sidebar-content">
        <h1>MUNSEL HARMONY TONAL BOOK</h1>

        <div class="controls">
          <div class="control-group">
            <label class="select-label" for="hueSelect">Primary hue
              <select id="hueSelect"></select>
            </label>
            <div class="control-buttons">
              <button id="previousHue" type="button" aria-label="Previous primary hue">← Previous</button>
              <button id="nextHue" type="button" aria-label="Next primary hue">Next →</button>
            </div>
          </div>
          <div class="control-group">
            <label class="select-label" for="angleSelect">Hue angle
              <select id="angleSelect"></select>
            </label>
            <div class="control-buttons">
              <button id="previousAngle" type="button" aria-label="Previous hue angle">← Previous</button>
              <button id="nextAngle" type="button" aria-label="Next hue angle">Next →</button>
            </div>
          </div>
        </div>

        <div class="palettes">
          <section class="palette-panel" aria-labelledby="hierarchicalTitle">
            <h2 id="hierarchicalTitle">Hierarchical Advanced Palette</h2>
            <div id="hierarchicalPalette" class="palette-result"></div>
          </section>
          <section class="palette-panel" aria-labelledby="equalTitle">
            <h2 id="equalTitle">Equal-Lightness Advanced Palette</h2>
            <div id="equalPalette" class="palette-result"></div>
          </section>
        </div>
      </div>
      <div class="page-heading">
        <h2 id="pageTitle">Loading…</h2>
        <span class="page-note">Chroma: primary + → neutral 0 → related − &nbsp;·&nbsp; Value: lightest → darkest</span>
      </div>
      <p id="status" class="status">Loading Munsell renotations…</p>
    </section>

    <section class="grid-panel" aria-label="Signed-Chroma hue-angle grid">
      <div id="bookScroll" class="book-scroll">
        <div id="bookGrid" class="book-grid"></div>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const HUE_FAMILIES = ["R", "YR", "Y", "GY", "G", "BG", "B", "PB", "P", "RP"];
      const HUE_STEPS = [2.5, 5, 7.5, 10];
      const CHROMAS = Array.from({ length: 13 }, (_, index) => (index + 1) * 2);
      const VALUE_STEP = 0.5;
      const MAX_EXTENDED_COLORS = 70;
      const RESERVED_OFF_COLOR_SLOTS = 12;
      const PALETTE_DISPLAY_CAPACITY = 84;
      const ANGLES = [
        { name: "Complement", direction: "", offset: 20, label: "Complement — 20" },
        { name: "Split Complement", direction: "LEFT", offset: -17, label: "Split Complement — LEFT (−17)" },
        { name: "Split Complement", direction: "RIGHT", offset: 17, label: "Split Complement — RIGHT (+17)" },
        { name: "Analog", direction: "LEFT", offset: -3, label: "Analog — LEFT (−3)" },
        { name: "Analog", direction: "RIGHT", offset: 3, label: "Analog — RIGHT (+3)" },
        { name: "Quarter", direction: "LEFT", offset: -10, label: "Quarter — LEFT (−10)" },
        { name: "Quarter", direction: "RIGHT", offset: 10, label: "Quarter — RIGHT (+10)" },
        { name: "Thirds", direction: "LEFT", offset: -13, label: "Thirds — LEFT (−13)" },
        { name: "Thirds", direction: "RIGHT", offset: 13, label: "Thirds — RIGHT (+13)" },
      ];
      const ANCHOR_HIGHLIGHTS = { hierarchical: "#ffcf40", equal: "#49e6e0" };

      const hueSelect = document.querySelector("#hueSelect");
      const angleSelect = document.querySelector("#angleSelect");
      const bookGrid = document.querySelector("#bookGrid");
      const pageTitle = document.querySelector("#pageTitle");
      const status = document.querySelector("#status");
      const bookScroll = document.querySelector("#bookScroll");
      const hierarchicalPalette = document.querySelector("#hierarchicalPalette");
      const equalPalette = document.querySelector("#equalPalette");
      let rowsByHue = new Map();
      let hues = [];
      let values = [];
      let swatchesByCoordinate = new Map();

      function parseCsv(text) {
        const [headerLine, ...lines] = text.trim().split(/\r?\n/);
        const headers = headerLine.split(",");
        return lines.map((line) => {
          const fields = line.split(",");
          return Object.fromEntries(headers.map((header, index) => [header, fields[index]]));
        });
      }

      function hueRank(hue) {
        const match = hue.match(/^([\d.]+)([A-Z]+)$/);
        if (!match) return Number.MAX_SAFE_INTEGER;
        return HUE_FAMILIES.indexOf(match[2]) * HUE_STEPS.length + HUE_STEPS.indexOf(Number(match[1]));
      }

      function makeCell(className, text = "") {
        const cell = document.createElement("div");
        cell.className = className;
        cell.textContent = text;
        return cell;
      }

      function rgb(row) {
        return [row.sRGB_R, row.sRGB_G, row.sRGB_B].map((channel) => Math.round(Number(channel) * 255));
      }

      function coordinateKey(row) {
        return `${row.H}:${Number(row.V)}:${Number(row.C)}`;
      }

      function makeSwatch(row, extraClass = "") {
        if (!row) return makeCell(`empty ${extraClass}`.trim());
        const swatch = makeCell(`swatch ${extraClass}`.trim(), row.MUNSELL_NAME);
        const [red, green, blue] = rgb(row);
        const relativeBrightness = 0.2126 * red + 0.7152 * green + 0.0722 * blue;
        swatch.style.background = `rgb(${red} ${green} ${blue})`;
        swatch.style.setProperty("--label-color", relativeBrightness > 145 ? "#111318" : "#fff");
        swatch.style.setProperty("--label-shadow", relativeBrightness > 145 ? "0 1px 1px rgb(255 255 255 / .25)" : "0 1px 2px rgb(0 0 0 / .8)");
        swatchesByCoordinate.set(coordinateKey(row), swatch);
        return swatch;
      }

      function rowAt(hue, value, chroma) {
        return (rowsByHue.get(hue) || []).find((row) => Number(row.V) === Number(value) && Number(row.C) === Number(chroma));
      }

      function selectedAngle() {
        return ANGLES[Number(angleSelect.value)];
      }

      function selectedRelatedHue() {
        const primaryIndex = hues.indexOf(hueSelect.value);
        return hues[(primaryIndex + selectedAngle().offset + hues.length) % hues.length];
      }

      function superiorBrightest(hue, excludedValues = new Set()) {
        return [...(rowsByHue.get(hue) || [])]
          .filter((row) => !excludedValues.has(Number(row.V)))
          .sort((a, b) => Number(b.C) - Number(a.C) || Number(b.V) - Number(a.V))[0];
      }

      function hierarchicalBrightests(primaryHue, relatedHue) {
        const excludedValues = new Set();
        while (true) {
          const superior = superiorBrightest(primaryHue, excludedValues);
          if (!superior) return [undefined, undefined];
          for (let chroma = Number(superior.C); chroma > 2; chroma -= 2) {
            const inferior = rowAt(relatedHue, Number(superior.V), chroma);
            if (inferior) return [superior, inferior];
          }
          excludedValues.add(Number(superior.V));
        }
      }

      function equalLightnessBrightests(primaryHue, relatedHue) {
        const shared = [];
        (rowsByHue.get(primaryHue) || []).forEach((first) => {
          const second = rowAt(relatedHue, Number(first.V), Number(first.C));
          if (second) shared.push([first, second]);
        });
        return shared.sort(([firstA], [firstB]) => Number(firstB.C) - Number(firstA.C) || Number(firstB.V) - Number(firstA.V))[0] || [undefined, undefined];
      }

      function extend(anchor) {
        if (!anchor) return { colors: [], malformed: false };
        const anchorChroma = Number(anchor.C);
        const maximumChroma = CHROMAS[CHROMAS.length - 1];
        const chromaLines = anchorChroma > 2 ? [anchorChroma] : [];
        for (let delta = 4; anchorChroma - delta > 0 || anchorChroma + delta <= maximumChroma; delta += 2) {
          const lowerChroma = anchorChroma - delta;
          const higherChroma = anchorChroma + delta;
          if (lowerChroma > 2) chromaLines.push(lowerChroma);
          if (higherChroma <= maximumChroma) chromaLines.push(higherChroma);
        }
        const maximumValue = values[0];
        const minimumValue = values[values.length - 1];
        const valueOffsets = [0];
        for (let offset = 3; ; offset += 3) {
          const lighterValue = Number((Number(anchor.V) + offset * VALUE_STEP).toFixed(10));
          const darkerValue = Number((Number(anchor.V) - offset * VALUE_STEP).toFixed(10));
          if (lighterValue > maximumValue && darkerValue < minimumValue) break;
          if (lighterValue <= maximumValue) valueOffsets.push(offset);
          if (darkerValue >= minimumValue) valueOffsets.push(-offset);
        }
        const colors = [];
        chromaLines.forEach((chroma) => {
          valueOffsets.forEach((offset) => {
            const value = Number((Number(anchor.V) + offset * VALUE_STEP).toFixed(10));
            const color = rowAt(anchor.H, value, chroma);
            if (color && !colors.includes(color)) colors.push(color);
          });
        });
        return { colors, malformed: colors.length === 0 };
      }

      function offColor(hue, kind, chroma) {
        const candidates = (rowsByHue.get(hue) || []).filter((row) => Number(row.C) === chroma);
        if (kind === "White") return [...candidates].sort((a, b) => Number(b.V) - Number(a.V))[0];
        if (kind === "Black") {
          return candidates
            .sort((a, b) => Number(a.V) - Number(b.V))[0];
        }
        return candidates.find((row) => Number(row.V) === 6);
      }

      function paletteColor(row, label, malformed = false) {
        if (label === "reserved") {
          const reserved = makeCell("palette-color reserved");
          reserved.setAttribute("aria-hidden", "true");
          return reserved;
        }
        const item = makeCell(`palette-color${malformed ? " malformed" : ""}`);
        const chip = makeCell("palette-chip");
        const name = makeCell("palette-color-name", malformed ? `${label}\nBLANK` : row?.MUNSELL_NAME || `${label}\nUNDEFINED`);
        if (row && !malformed) {
          const [red, green, blue] = rgb(row);
          chip.style.background = `rgb(${red} ${green} ${blue})`;
          item.title = label;
        } else {
          item.classList.add("malformed");
        }
        item.append(chip, name);
        return item;
      }

      function paletteGroup(title, entries) {
        const group = makeCell("palette-group");
        group.append(makeCell("palette-group-title", title));
        const colors = makeCell("palette-colors");
        entries.forEach((entry) => colors.append(paletteColor(entry.row, entry.label, entry.malformed)));
        group.append(colors);
        return group;
      }

      function advancedOffColors(hue, errors) {
        const entries = [];
        ["White", "Black", "Gray"].forEach((kind) => {
          const chroma = 2;
          const label = `Off-${kind} 2 · ${hue}`;
          const row = offColor(hue, kind, chroma);
          const malformed = !row;
          if (malformed) {
            errors.push(`${label} is undefined.`);
          }
          entries.push({ row, label, malformed });
        });
        return entries;
      }

      function highlightAnchors(anchors, kind) {
        anchors.filter(Boolean).forEach((row) => {
          const swatch = swatchesByCoordinate.get(coordinateKey(row));
          if (!swatch) return;
          const current = swatch.dataset.anchorHighlights ? swatch.dataset.anchorHighlights.split(",") : [];
          current.push(kind);
          swatch.dataset.anchorHighlights = [...new Set(current)].join(",");
          const kinds = swatch.dataset.anchorHighlights.split(",");
          swatch.style.boxShadow = kinds.map((highlightKind, index) => `0 0 0 ${2 + index * 3}px ${ANCHOR_HIGHLIGHTS[highlightKind]}`).join(", ");
          swatch.style.zIndex = "4";
        });
      }

      function renderPalette(container, anchors, relationship) {
        const errors = [];
        const primaryHue = hueSelect.value;
        const relatedHue = selectedRelatedHue();
        const anchorLabels = relationship === "hierarchical" ? ["Superior Brightest", "Inferior Brightest"] : ["Equal-Lightness Brightest", "Equal-Lightness Brightest"];
        const anchorEntries = anchors.map((row, index) => {
          if (!row) errors.push(`${anchorLabels[index]} for ${index === 0 ? primaryHue : relatedHue} is undefined.`);
          return { row, label: `${anchorLabels[index]} · ${index === 0 ? primaryHue : relatedHue}`, malformed: !row };
        });
        const extendedEntries = [];
        anchors.forEach((anchor, index) => {
          const hue = index === 0 ? primaryHue : relatedHue;
          const extension = extend(anchor);
          if (extension.malformed) {
            extendedEntries.push({ row: undefined, label: `Basic Extended · ${hue}`, malformed: true });
            errors.push(`Basic Extended Palette for ${hue} is malformed because no eligible colors were generated in any direction.`);
          } else {
            extension.colors.forEach((row) => extendedEntries.push({ row, label: `Basic Extended · ${hue}`, malformed: false }));
          }
        });
        const offEntries = [...advancedOffColors(primaryHue, errors), ...advancedOffColors(relatedHue, errors)];
        while (offEntries.length < RESERVED_OFF_COLOR_SLOTS) offEntries.push({ row: undefined, label: "reserved", malformed: false });

        const paletteHueOrder = [primaryHue, relatedHue];
        extendedEntries.sort((first, second) => {
          if (!first.row && !second.row) return 0;
          if (!first.row) return 1;
          if (!second.row) return -1;
          return paletteHueOrder.indexOf(first.row.H) - paletteHueOrder.indexOf(second.row.H)
            || Number(second.row.V) - Number(first.row.V)
            || Number(second.row.C) - Number(first.row.C);
        });
        if (!extendedEntries.length) extendedEntries.push({ row: undefined, label: "No in-gamut extended colors", malformed: true });
        while (extendedEntries.length < MAX_EXTENDED_COLORS) extendedEntries.push({ row: undefined, label: "reserved", malformed: false });

        const groups = makeCell("palette-groups");
        groups.append(
          paletteGroup("Brightests", anchorEntries),
          paletteGroup("Basic Extended", extendedEntries),
          paletteGroup("Off-Whites, Off-Blacks, and Off-Grays", offEntries),
        );
        const errorArea = makeCell("palette-error-area");
        if (errors.length) {
          const list = makeCell("palette-errors");
          errors.forEach((error) => list.append(makeCell("", error)));
          errorArea.append(list);
        }
        container.replaceChildren(groups, errorArea);
        container.dataset.displayCapacity = PALETTE_DISPLAY_CAPACITY;
        highlightAnchors(anchors, relationship);
      }

      function makeLookup(hue) {
        return new Map((rowsByHue.get(hue) || []).map((row) => [`${Number(row.V)}:${Number(row.C)}`, row]));
      }

      function renderRow(fragment, label, labelClass, lookup, chroma, extraClass = "") {
        const labelCell = makeCell(`chroma-label ${labelClass}`, label);
        const hueName = document.createElement("span");
        hueName.textContent = labelClass === "primary" ? hueSelect.value : labelClass === "related" ? selectedRelatedHue() : "N";
        labelCell.append(hueName);
        fragment.append(labelCell);
        values.forEach((value) => fragment.append(makeSwatch(lookup.get(`${value}:${chroma}`), extraClass)));
      }

      function renderPage() {
        swatchesByCoordinate = new Map();
        const primaryHue = hueSelect.value;
        const relatedHue = selectedRelatedHue();
        const primaryLookup = makeLookup(primaryHue);
        const relatedLookup = makeLookup(relatedHue);
        const neutralLookup = makeLookup("N");
        const fragment = document.createDocumentFragment();

        fragment.append(makeCell("corner", "C ↑↓\nV →"));
        values.forEach((value) => fragment.append(makeCell("value-heading", value)));
        [...CHROMAS].reverse().forEach((chroma) => renderRow(fragment, `+${chroma}`, "primary", primaryLookup, chroma));
        renderRow(fragment, "0", "neutral", neutralLookup, 0, "neutral-cell");
        CHROMAS.forEach((chroma) => renderRow(fragment, `−${chroma}`, "related", relatedLookup, chroma));

        bookGrid.style.setProperty("--value-count", values.length);
        bookGrid.replaceChildren(fragment);
        renderPalette(hierarchicalPalette, hierarchicalBrightests(primaryHue, relatedHue), "hierarchical");
        renderPalette(equalPalette, equalLightnessBrightests(primaryHue, relatedHue), "equal");
        pageTitle.textContent = `${primaryHue} + ${relatedHue} — ${selectedAngle().label}`;
        status.hidden = true;
        history.replaceState(null, "", `#${primaryHue}`);
        bookScroll.scrollTo({ top: 0, left: 0 });
      }

      function moveSelect(select, offset) {
        select.selectedIndex = (select.selectedIndex + offset + select.options.length) % select.options.length;
        renderPage();
      }

      async function initialize() {
        try {
          const response = await fetch("./assets/munsell_renotation_oklch.csv");
          if (!response.ok) throw new Error(`Could not load CSV (${response.status}).`);
          const rows = parseCsv(await response.text()).filter((row) => Number(row.V) >= 1);
          rows.forEach((row) => {
            if (!rowsByHue.has(row.H)) rowsByHue.set(row.H, []);
            rowsByHue.get(row.H).push(row);
          });

          hues = [...rowsByHue.keys()].filter((hue) => hue !== "N").sort((a, b) => hueRank(a) - hueRank(b));
          values = [...new Set(rows.map((row) => Number(row.V)))].sort((a, b) => b - a);
          hues.forEach((hue) => hueSelect.add(new Option(hue, hue)));
          ANGLES.forEach((angle, index) => angleSelect.add(new Option(angle.label, index)));
          const hashHue = decodeURIComponent(location.hash.slice(1));
          hueSelect.value = hues.includes(hashHue) ? hashHue : "5R";
          angleSelect.value = "0";
          renderPage();
        } catch (error) {
          pageTitle.textContent = "Munsell data unavailable";
          status.textContent = error.message;
          console.error(error);
        }
      }

      hueSelect.addEventListener("change", renderPage);
      angleSelect.addEventListener("change", renderPage);
      document.querySelector("#previousHue").addEventListener("click", () => moveSelect(hueSelect, -1));
      document.querySelector("#nextHue").addEventListener("click", () => moveSelect(hueSelect, 1));
      document.querySelector("#previousAngle").addEventListener("click", () => moveSelect(angleSelect, -1));
      document.querySelector("#nextAngle").addEventListener("click", () => moveSelect(angleSelect, 1));
      window.addEventListener("keydown", (event) => {
        if ([hueSelect, angleSelect].includes(event.target)) return;
        if (event.key === "ArrowLeft") moveSelect(hueSelect, -1);
        if (event.key === "ArrowRight") moveSelect(hueSelect, 1);
      });

      initialize();
    })();
  </script>
</body>
</html>
