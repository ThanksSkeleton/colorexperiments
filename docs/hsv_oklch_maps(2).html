<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HSV Slice and OKLCH Lightness Maps</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 24px;
      background: Canvas;
      color: CanvasText;
    }

    h1 {
      font-size: 22px;
      margin: 0 0 8px;
    }

    p {
      margin: 0 0 20px;
      max-width: 960px;
      line-height: 1.45;
    }

    .maps {
      display: flex;
      flex-direction: row;
      gap: 18px;
      align-items: flex-start;
      overflow-x: auto;
      padding-bottom: 12px;
    }

    figure {
      margin: 0;
      padding: 12px;
      border: 1px solid color-mix(in srgb, CanvasText 20%, transparent);
      border-radius: 10px;
      background: color-mix(in srgb, Canvas 94%, CanvasText 6%);
    }

    figcaption {
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 8px;
      text-align: center;
      letter-spacing: 0.02em;
    }

    canvas {
      display: block;
      width: 360px;
      height: 120px;
      image-rendering: pixelated;
      border: 1px solid color-mix(in srgb, CanvasText 30%, transparent);
      background: black;
    }

    .axis-note {
      font-size: 12px;
      margin-top: 8px;
      opacity: 0.78;
      text-align: center;
    }

    #stats {
      margin-top: 16px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>HSV Slice and OKLCH Lightness Maps</h1>
  <p>
    Fixed value: <strong>HSV V = 90%</strong>. X-axis is hue from 0° to 359°.
    Y-axis is saturation from 0% at the top to 100% at the bottom.
  </p>

  <main class="maps">
    <figure>
      <figcaption>1. ORIGINAL MAP</figcaption>
      <canvas id="original" width="360" height="120"></canvas>
      <div class="axis-note">HSV: H = x, S = y, V = 90%; band 1 = S 100%; band 2 = HSV complement</div>
    </figure>

    <figure>
      <figcaption>2. PERCEPTUAL BRIGHTNESS MAP</figcaption>
      <canvas id="lightness" width="360" height="120"></canvas>
      <div class="axis-note">grayscale = OKLCH L × 255; band 1 = S 100%; band 2 = HSV complement</div>
    </figure>

    <figure>
      <figcaption>3. HSV COMPLEMENT ΔL MAP</figcaption>
      <canvas id="difference" width="360" height="120"></canvas>
      <div class="axis-note">grayscale = |L(original) − L(HSV complement)| × 255; band 1 = S 100%; band 2 = HSV complement</div>
    </figure>
  </main>

  <div id="stats"></div>

  <script>
    const WIDTH = 360;
    const MAP_HEIGHT = 100;
    const BAND_HEIGHT = 10;
    const ORIGINAL_BAND_Y = MAP_HEIGHT;
    const COMPLEMENT_BAND_Y = MAP_HEIGHT + BAND_HEIGHT;
    const HEIGHT = MAP_HEIGHT + (BAND_HEIGHT * 2);
    const VALUE = 0.90;

    function clamp01(x) {
      return Math.min(1, Math.max(0, x));
    }

    function byte(x) {
      return Math.round(clamp01(x) * 255);
    }

    function hsvToRgb(h, s, v) {
      h = ((h % 360) + 360) % 360;
      const c = v * s;
      const hp = h / 60;
      const x = c * (1 - Math.abs((hp % 2) - 1));
      let r1 = 0, g1 = 0, b1 = 0;

      if (hp >= 0 && hp < 1)      [r1, g1, b1] = [c, x, 0];
      else if (hp < 2)            [r1, g1, b1] = [x, c, 0];
      else if (hp < 3)            [r1, g1, b1] = [0, c, x];
      else if (hp < 4)            [r1, g1, b1] = [0, x, c];
      else if (hp < 5)            [r1, g1, b1] = [x, 0, c];
      else                        [r1, g1, b1] = [c, 0, x];

      const m = v - c;
      return [r1 + m, g1 + m, b1 + m];
    }

    function srgbToLinear(c) {
      return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
    }

    // Returns OKLab L. OKLCH uses the same L component; C and h are not needed here.
    function rgbToOklabL(r, g, b) {
      const lr = srgbToLinear(r);
      const lg = srgbToLinear(g);
      const lb = srgbToLinear(b);

      const l = 0.4122214708 * lr + 0.5363325363 * lg + 0.0514459929 * lb;
      const m = 0.2119034982 * lr + 0.6806995451 * lg + 0.1073969566 * lb;
      const s = 0.0883024619 * lr + 0.2817188376 * lg + 0.6299787005 * lb;

      const l_ = Math.cbrt(l);
      const m_ = Math.cbrt(m);
      const s_ = Math.cbrt(s);

      return 0.2104542553 * l_ + 0.7936177850 * m_ - 0.0040720468 * s_;
    }

    function draw() {
      const originalCanvas = document.getElementById("original");
      const lightnessCanvas = document.getElementById("lightness");
      const differenceCanvas = document.getElementById("difference");

      const originalCtx = originalCanvas.getContext("2d", { willReadFrequently: false });
      const lightnessCtx = lightnessCanvas.getContext("2d", { willReadFrequently: false });
      const differenceCtx = differenceCanvas.getContext("2d", { willReadFrequently: false });

      const original = originalCtx.createImageData(WIDTH, HEIGHT);
      const lightness = lightnessCtx.createImageData(WIDTH, HEIGHT);
      const difference = differenceCtx.createImageData(WIDTH, HEIGHT);

      let minL = Infinity;
      let maxL = -Infinity;
      let minDeltaL = Infinity;
      let maxDeltaL = -Infinity;
      let maxDeltaAt = { h: 0, s: 0 };

      for (let y = 0; y < MAP_HEIGHT; y++) {
        const sat = y / (MAP_HEIGHT - 1);

        for (let x = 0; x < WIDTH; x++) {
          const hue = x;
          const [r, g, b] = hsvToRgb(hue, sat, VALUE);
          const L = rgbToOklabL(r, g, b);

          const complementHue = (hue + 180) % 360;
          const [cr, cg, cb] = hsvToRgb(complementHue, sat, VALUE);
          const complementL = rgbToOklabL(cr, cg, cb);
          const deltaL = Math.abs(L - complementL);

          minL = Math.min(minL, L);
          maxL = Math.max(maxL, L);
          minDeltaL = Math.min(minDeltaL, deltaL);
          if (deltaL > maxDeltaL) {
            maxDeltaL = deltaL;
            maxDeltaAt = { h: hue, s: sat };
          }

          const i = (y * WIDTH + x) * 4;

          original.data[i + 0] = byte(r);
          original.data[i + 1] = byte(g);
          original.data[i + 2] = byte(b);
          original.data[i + 3] = 255;

          const lightGray = byte(L);
          lightness.data[i + 0] = lightGray;
          lightness.data[i + 1] = lightGray;
          lightness.data[i + 2] = lightGray;
          lightness.data[i + 3] = 255;

          const diffGray = byte(deltaL);
          difference.data[i + 0] = diffGray;
          difference.data[i + 1] = diffGray;
          difference.data[i + 2] = diffGray;
          difference.data[i + 3] = 255;
        }
      }

      // Add two 10px fully saturated reference bands beneath each map.
      // Band 1: the original hue sequence.
      // Band 2: the HSV-complement hue sequence, shifted by 180 degrees.
      for (let y = ORIGINAL_BAND_Y; y < HEIGHT; y++) {
        const isComplementBand = y >= COMPLEMENT_BAND_Y;

        for (let x = 0; x < WIDTH; x++) {
          const referenceHue = isComplementBand ? (x + 180) % 360 : x;
          const [r, g, b] = hsvToRgb(referenceHue, 1, VALUE);
          const i = (y * WIDTH + x) * 4;

          for (const image of [original, lightness, difference]) {
            image.data[i + 0] = byte(r);
            image.data[i + 1] = byte(g);
            image.data[i + 2] = byte(b);
            image.data[i + 3] = 255;
          }
        }
      }

      originalCtx.putImageData(original, 0, 0);
      lightnessCtx.putImageData(lightness, 0, 0);
      differenceCtx.putImageData(difference, 0, 0);

      document.getElementById("stats").textContent =
        `Observed OKLCH/OKLab L range: ${minL.toFixed(4)} – ${maxL.toFixed(4)}\n` +
        `Observed |ΔL| range for HSV complements: ${minDeltaL.toFixed(4)} – ${maxDeltaL.toFixed(4)}\n` +
        `Maximum |ΔL| occurs near H=${maxDeltaAt.h}°, S=${Math.round(maxDeltaAt.s * 100)}%, V=90%.`;
    }

    draw();
  </script>
</body>
</html>
